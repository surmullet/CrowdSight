[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crowdsight-ai-ml"
version = "0.1.0"
description = "Model adapters, observation contracts, and evaluation tools for CrowdSight"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.2.6,<3",
  "PyYAML>=6.0.3,<7",
]

[project.scripts]
crowdsight = "crowdsight.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = [
    "cv2",
    "cv2.*",
    "crowdsight.detection.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "shapely.*",
    "ultralytics.*",
    "torch.*",
    "torchvision.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "yaml",
    "yaml.*",
    "jsonschema.validators",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # do not perform function calls in argument defaults (FastAPI Depends)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

